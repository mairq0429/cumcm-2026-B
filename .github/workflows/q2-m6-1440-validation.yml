name: Q2 M6 1440 validation

on:
  push:
    branches:
      - chatgpt/m6-1440-validation
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression suite
        working-directory: B_code
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run full 1440 M6 baseline
        env:
          PYTHONPATH: B_code/src
        run: |
          python - <<'PY'
          from q2_m6_1440_validation import run_1440_baseline
          import json
          result = run_1440_baseline()
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Diagnose local C20 frontier without changing formal grid
        env:
          PYTHONPATH: B_code/src
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import q2_selection as q2
          from q2_certificate_acceleration import PhysicalCertificateTree, StrictCertificateAccelerator

          out = Path('03_results/q2/m6_validation/candidate_frontier_diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          S1 = (1700.0, 0.0)
          cfg = q2.Q2Config(circle_sides=1440, eps_rec_cert_m=1e-3, lmin_m=50.0)
          p1 = q2.build_P1_bound(S1, 0.0, cfg)
          engine = StrictCertificateAccelerator(PhysicalCertificateTree(p1, S1, cfg), cfg)

          # Diagnostic-only local 2.5 m lattice around the formal 20 m and 5 m selections.
          # This does not alter search_strict_candidates or the formal (50,20,5) grid.
          step = 2.5
          points = []
          x = 1690.0
          while x <= 1750.0 + 1e-12:
              y = -70.0
              while y <= -20.0 + 1e-12:
                  if math.hypot(x-S1[0], y-S1[1]) + 1e-12 >= cfg.lmin_m:
                      points.append((round(x, 10), round(y, 10)))
                  y += step
              x += step

          batch = engine.certify_points(points, 0.0)
          certs = batch['certificates']
          sources = q2.build_Gext(p1, S1, 20.0)
          rows = []
          inconclusive = []
          for point in points:
              cert = certs[point]
              row = {
                  'S2': list(point),
                  'T2': math.hypot(point[0]-S1[0], point[1]-S1[1]) / q2.SPEED_MPS,
                  'certificate_status': cert['status'],
                  'L_rec_m': cert.get('L_rec_m'),
                  'U_rec_m': cert.get('U_rec_m'),
              }
              if cert['status'] == 'CERTIFIED_STRICT':
                  screen = q2.screen_candidate_c20(point, S1, p1, sources, cfg)
                  row['cheap_screen'] = screen['screen_status']
                  row['cheap_sample_JR'] = screen['sample_JR']
                  if screen['screen_status'] != 'PROVEN_NOT_C20':
                      inconclusive.append((row['T2'], point))
              rows.append(row)

          # Full M4 only for the lowest-T2 strict candidates whose one-sided screen
          # cannot already prove they are outside C20, plus both formal selected points.
          formal_points = {(1710.0, -50.0), (1727.5, -42.5)}
          eval_points = []
          seen = set()
          for _, point in sorted(inconclusive)[:40]:
              if point not in seen:
                  eval_points.append(point); seen.add(point)
          for point in sorted(formal_points):
              if point not in seen:
                  eval_points.append(point); seen.add(point)

          evaluations = []
          for point in eval_points:
              cert = certs.get(point)
              if cert is None:
                  cert = q2.certified_strict(point, p1, S1, cfg)
              result = q2.evaluate_candidate_nested(
                  point, S1, p1, cfg, certificate_override=cert
              )
              candidate = result.get('candidate')
              evaluations.append({
                  'S2': list(point),
                  'T2': math.hypot(point[0]-S1[0], point[1]-S1[1]) / q2.SPEED_MPS,
                  'certificate_status': cert['status'],
                  'M4_status': result.get('status'),
                  'source_convergence': result.get('source_convergence'),
                  'error_convergence': result.get('error_convergence'),
                  'gverify': result.get('gverify', {}).get('status'),
                  'warnings': result.get('warnings', []),
                  'JD': None if candidate is None else candidate.JD,
                  'JR': None if candidate is None else candidate.JR,
                  'JA': None if candidate is None else candidate.JA,
                  'official20': None if candidate is None else candidate.official20,
                  'operational17': None if candidate is None else candidate.operational17,
              })

          c20 = [r for r in evaluations if r['M4_status']=='PASS' and r['certificate_status']=='CERTIFIED_STRICT' and r['official20'] is True]
          best = min(c20, key=lambda r: (r['T2'], r['JR'], r['JD'], r['S2'][0], r['S2'][1])) if c20 else None
          payload = {
              'artifact_status': 'DIAGNOSTIC / NOT_FORMAL_M6_RESULT',
              'purpose': 'local C20 frontier diagnosis; formal candidate grid remains exactly (50,20,5)',
              'lattice': {'step_m': step, 'x_range': [1690.0,1750.0], 'y_range': [-70.0,-20.0], 'point_count': len(points)},
              'certificate_batch': {k:v for k,v in batch.items() if k != 'certificates'},
              'status_counts': {
                  status: sum(certs[p]['status']==status for p in points)
                  for status in ('CERTIFIED_STRICT','CERTIFIED_VIOLATION','UNCERTAIN_BOUNDARY','UNRESOLVED')
              },
              'full_M4_evaluation_count': len(evaluations),
              'best_diagnostic_C20': best,
              'evaluations': evaluations,
              'point_screen_records': rows,
          }
          (out/'local_frontier.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k not in ('point_screen_records',)}, ensure_ascii=False, indent=2))
          PY
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-m6-1440-validation
          path: |
            03_results/q2/m6_validation/1440_baseline
            03_results/q2/m6_validation/candidate_frontier_diagnostic
          if-no-files-found: warn
      - name: Enforce formal 1440 gate
        env:
          PYTHONPATH: B_code/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('03_results/q2/m6_validation/1440_baseline/summary.json').read_text())
          if summary.get('status') != 'PASS':
              raise SystemExit(2)
          PY
